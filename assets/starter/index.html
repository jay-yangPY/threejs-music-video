<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Three.js Music Video · Starter</title>
<style>*{box-sizing:border-box}body{margin:0;background:#080909;color:#eee9df;font:15px system-ui}canvas{display:block;width:100vw;height:100vh;object-fit:contain}#controls{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:14px;padding:12px 20px;border-radius:24px;background:#191919e8}input{width:230px;accent-color:#f27031}button{background:none;color:inherit;border:0;cursor:pointer}.render #controls{display:none}#error{position:fixed;top:20px;left:20px;background:#300;color:white;white-space:pre-wrap}</style></head>
<body><canvas id="screen"></canvas><div id="controls"><button id="play">播放演示</button><input id="seek" aria-label="时间" type="range" min="0" step="0.01"><span id="clock">0.00</span><span id="mode">静音示例</span></div><pre id="error" hidden></pre><script type="module" src="/src/main.ts"></script></body></html>
